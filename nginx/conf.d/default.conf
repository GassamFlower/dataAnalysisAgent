# 数据分析 Agent 站点配置
# 所有请求统一走 Next.js（BFF 层），后端由 Next.js 内部转发
# 安全要求：生产必须启用 HTTPS（443），并把明文的 80 端口 301 到 https。

# ── HTTP server：仅用于 301 跳转到 HTTPS（并做微信域名验证文件放行）──
server {
    listen 80;
    server_name _;  # 有域名时填实际域名（如 api.example.com）

    # 微信域名验证文件（微信需要明文 80 端口验权时保留）
    location ~ ^/MP_verify_.*\.txt$ {
        root /usr/share/nginx/html;
        access_log off;
    }

    # 其余一律 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server：主流量入口 ──
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS 证书（部署时替换为实际证书路径）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：仅在 HTTPS 下发，强制浏览器只走 HTTPS（半年有效期）
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 认证端点（登录/注册/验证码）：更严格限流 1r/s，防密码爆破与验证码轰炸
    location ~ ^/api/v1/auth/ {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 支付回调：上游校验签名 + IP 白名单（此处按普通 /api 转发即可，不再额外放大）
    location /api/payment/orders/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 限流（在 Nginx 入口层限制）
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 所有其他请求 → Next.js 前端（同源加载）
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 微信域名验证文件
    location ~ ^/MP_verify_.*\.txt$ {
        root /usr/share/nginx/html;
        access_log off;
    }

    # 禁止访问隐藏/敏感文件
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(env|git|htaccess)$ { deny all; }
}