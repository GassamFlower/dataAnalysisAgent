name: 敏感信息扫描

# 防止把真实密钥提交进公开仓库（历史教训：deploy/deploy.sh 曾硬编码 sk- 密钥）。
# 扫描范围覆盖所有被 git 跟踪的文件；命中常见密钥特征即失败。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secretscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描常见真实密钥特征
        run: |
          set +e
          HIT=0
          # 只扫被跟踪文件，避免扫进 node_modules/.env.xxx(已 gitignore)
          for f in $(git ls-files); do
            grep -nE \
              -e 'sk-[A-Za-z0-9]{20,}' \
              -e '(sk|api[_-]?key|apikey|secret|token|passwd|password)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_\-]{24,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              "$f" 2>/dev/null && HIT=1
          done
          if [ "$HIT" -eq 1 ]; then
            echo "::error::检测到疑似硬编码密钥，请改为 .env 环境变量注入或占位符"
            exit 1
          fi
          echo "✓ 未检测到疑似硬编码密钥"